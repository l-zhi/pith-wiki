name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # ubuntu + macos: 双平台覆盖。Windows 不进 matrix（fs-event 语义、`rename`、
    # `path.delimiter` 三处都不一样；首发不投入 Windows 兼容工程量）。
    # 详见 docs/adr/0003-windows-best-effort.md。
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台失败不阻塞其它平台跑完，便于一次 push 看完整全貌。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install core dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Typecheck core
        run: npm run typecheck

      - name: Typecheck desktop
        run: npm run typecheck --prefix desktop

      - name: Test
        run: npm test

      - name: Build core
        run: npm run build

      - name: Build desktop
        run: npm run build --prefix desktop

      - name: Smoke check CLI
        run: node dist/bin/pith-wiki.js --help
