name: release

# Tags publish only after every platform passes. Manual runs validate by default.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish verified packages (run on a version tag only)'
        type: boolean
        default: false
      notary_status:
        description: 'Only check Apple credentials and recent notarization status (no build or upload)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}${{ inputs.notary_status && '-notary-status' || '' }}
  cancel-in-progress: false

jobs:
  notary-status:
    if: github.event_name == 'workflow_dispatch' && inputs.notary_status
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Read notarization history from Apple
        timeout-minutes: 3
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing secret: $name" >&2
              exit 1
            fi
          done
          xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json > "$RUNNER_TEMP/notary-history.json"
          echo 'Apple authentication succeeded. Recent submissions (a successful query does not mean notarization passed):'
          jq '{history: [.history[:10][] | {id, name, createdDate, status}]}' "$RUNNER_TEMP/notary-history.json"

  prepare:
    if: ${{ !inputs.notary_status }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require a matching version tag for publishing
        env:
          SHOULD_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('desktop/package.json', 'utf8'));
          if (process.env.SHOULD_PUBLISH === 'true' &&
              (process.env.GITHUB_REF_TYPE !== 'tag' || process.env.GITHUB_REF_NAME !== `v${version}`)) {
            throw new Error('Publishing requires a v<desktop version> tag. Use publish=false for branch validation.');
          }
          NODE

  build:
    needs: prepare
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      # 引擎 import 仓库根 src（@core）；根依赖装上以防构建期解析需要
      - name: Install root deps
        run: npm ci

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Build, sign, notarize and verify macOS packages
        if: runner.os == 'macOS'
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
        run: npm run dist:mac:release

      - name: Build Windows packages
        if: runner.os == 'Windows'
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist -- --publish never

      # Upload only after all platform-specific checks succeed. No keychains,
      # effective build configurations, credentials or unpacked apps are uploaded.
      - name: Save verified packages
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          retention-days: 7
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml
            desktop/dist/macos-SHA256SUMS.txt

  publish:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --json isDraft > release-state.json 2>/dev/null; then
            if ! jq -e '.isDraft == true' release-state.json >/dev/null; then
              echo 'Refusing to overwrite an existing published release. Bump the version and tag.' >&2
              exit 1
            fi
          else
            gh release create "$tag" --verify-tag --draft --generate-notes --title "pith $tag"
          fi
          gh release upload "$tag" release-assets/* --clobber
          gh release edit "$tag" --draft=false
